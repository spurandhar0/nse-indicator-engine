name: NSE Telegram Image Report

on:
  workflow_run:
    workflows: ["NSE Indicator Engine"]   # auto-trigger after engine completes
    types: [completed]
  workflow_dispatch:                       # also allow manual run

permissions:
  contents: read

jobs:
  send-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas matplotlib requests pytz pillow openpyxl

      - name: Generate images & send to Telegram + WhatsApp
        env:
          TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}
          TWILIO_SID:        ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WA_FROM_NUMBER:    ${{ secrets.WA_FROM_NUMBER }}
          IMGBB_API_KEY:     ${{ secrets.IMGBB_API_KEY }}
        run: python src/tg_image_report.py
