name: NSE Telegram Image Report (Daily 9PM IST)

on:
  schedule:
    - cron: "30 15 * * 1-5"   # 9:00 PM IST = 15:30 UTC, Mon-Fri
  workflow_dispatch:           # allow manual trigger from GitHub UI

permissions:
  contents: read               # only needs to read output_data/

jobs:
  send-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas matplotlib requests pytz

      - name: Generate images & send to Telegram + WhatsApp
        env:
          TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}
          TWILIO_SID:        ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WA_FROM_NUMBER:    ${{ secrets.WA_FROM_NUMBER }}
          IMGBB_API_KEY:     ${{ secrets.IMGBB_API_KEY }}
        run: python src/tg_image_report.py
