name: NSE Telegram Image Report

on:
  workflow_run:
    workflows: ["NSE Indicator Engine"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  send-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check if already sent today
        id: guard
        run: |
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          echo "Today (IST): $TODAY"
          # Count successful runs of this workflow that started today (excluding current run)
          SENT=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/tg_image.yml/runs?status=success&per_page=10" \
            --jq "[.workflow_runs[] | select(.created_at | startswith(\"$TODAY\")) | select(.id != ${{ github.run_id }})] | length")
          echo "Already sent today: $SENT time(s)"
          echo "skip=$( [ "$SENT" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already sent today
        if: steps.guard.outputs.skip == 'true'
        run: echo "Image report already sent today — skipping duplicate."

      - name: Checkout repo
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install pandas matplotlib requests pytz pillow openpyxl

      - name: Generate images & send to Telegram + WhatsApp
        if: steps.guard.outputs.skip != 'true'
        env:
          TG_BOT_TOKEN:      ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:        ${{ secrets.TG_CHAT_ID }}
          TWILIO_SID:        ${{ secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          WA_FROM_NUMBER:    ${{ secrets.WA_FROM_NUMBER }}
          IMGBB_API_KEY:     ${{ secrets.IMGBB_API_KEY }}
        run: python src/tg_image_report.py
