name: NSE Indicator Engine (Daily 6:30PM IST)

on:
  workflow_run:
    workflows: ["NSE Bhavcopy Fetch (Daily 6:15PM IST)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    # On workflow_run: only proceed if bhavcopy succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pytz

      - name: Run NSE Indicator Engine
        env:
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          MC_AUTH_TOKEN: ${{ secrets.MC_AUTH_TOKEN }}   # optional: enables MC Search API (P5 fallback)
        run: python src/nse_engine.py

      - name: Commit output report to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_data/
          git diff --cached --quiet || git commit -m "auto: NSE report $(date +'%d-%b-%Y')"
          git pull --rebase --autostash origin main
          git push
