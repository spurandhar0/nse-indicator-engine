name: NSE Indicator Engine (Daily 8PM IST)

on:
  schedule:
    - cron: "30 14 * * 1-5"   # 8:00 PM IST = 14:30 UTC, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pytz

      - name: Run NSE Indicator Engine
        env:
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
          MC_AUTH_TOKEN: ${{ secrets.MC_AUTH_TOKEN }}   # optional: enables MC Search API (P5 fallback)
        run: python src/nse_engine.py

      - name: Commit output report to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p consolidated_data
          git add output_data/ consolidated_data/
          git diff --cached --quiet || git commit -m "auto: NSE report $(date +'%d-%b-%Y')"
          git push
