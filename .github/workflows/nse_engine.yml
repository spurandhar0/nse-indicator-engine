name: NSE Indicator Engine

on:
  schedule:
    - cron: '30 14 * * 1-5'   # 8:00 PM IST (2:30 PM UTC) Mon-Fri
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests pytz openpyxl

      - name: Run NSE Indicator Engine
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python src/nse_engine.py

      - name: Commit output report to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_data/
          git diff --staged --quiet || git commit -m "Auto: NSE Report $(date +'%d-%b-%Y')"
          git push
