name: NSE Bhavcopy Fetch (Daily 6:15PM IST)

on:
  schedule:
    - cron: "15 11 * * 1-5"   # 6:15 PM IST = 12:45 UTC, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pytz

      - name: Run NSE Bhavcopy Fetch
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
        run: python src/nse_bhavcopy_fetch.py

      - name: Cleanup old bhav data (keep last 3 months)
        run: |
          cd bhav_data
          COUNT=$(ls -td */ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 3 ]; then
            ls -td */ | tail -n +4 | sed 's|/$||' | xargs rm -rf
            echo "Removed $(($COUNT - 3)) old bhav folders, kept 3"
          else
            echo "Only $COUNT folders, no cleanup needed"
          fi
          cd ..

      - name: Commit bhav data to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add bhav_data/
          git diff --cached --quiet || git commit -m "auto: NSE bhavcopy $(date +'%d-%b-%Y')"
          git push
