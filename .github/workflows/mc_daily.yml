name: MC Daily Data Fetch

on:
  schedule:
    - cron: '30 13 * * 1-5'   # 7:00 PM IST (1:30 PM UTC) Mon-Fri
  workflow_dispatch:            # Manual run anytime

jobs:
  fetch-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run MC Data Fetch
        env:
          MC_AUTH_TOKEN: ${{ secrets.MC_AUTH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python src/mc_data_fetch.py

      - name: Commit indicator files to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicator_data/
          git diff --staged --quiet || git commit -m "Auto: MC indicator data $(date +'%d-%b-%Y')"
          git push
