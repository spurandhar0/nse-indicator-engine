name: MC Data Fetch (Daily 6PM IST)

on:
  schedule:
    - cron: "00 12 * * 1-5"   # 6:00 PM IST = 12:30 UTC, Mon-Fri
  workflow_dispatch:           # allow manual trigger

permissions:
  contents: write              # needed to commit files back to repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pytz

      - name: Run MC Data Fetch
        env:
          MC_AUTH_TOKEN: ${{ secrets.MC_AUTH_TOKEN }}
          TG_BOT_TOKEN:  ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:    ${{ secrets.TG_CHAT_ID }}
        run: python src/mc_data_fetch.py

      - name: Cleanup old indicator data (keep last 7 days)
        run: |
          cd indicator_data
          COUNT=$(ls -td */ 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 7 ]; then
            ls -td */ | tail -n +8 | sed 's|/$||' | xargs rm -rf
            echo "Removed $(($COUNT - 7)) old indicator folders, kept 7"
          else
            echo "Only $COUNT folders, no cleanup needed"
          fi
          cd ..

      - name: Commit indicator files to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add indicator_data/
          git diff --cached --quiet || git commit -m "auto: MC indicator data $(date +'%d-%b-%Y')"
          git push
